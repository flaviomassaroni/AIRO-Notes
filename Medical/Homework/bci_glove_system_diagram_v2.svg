<svg width="680" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architettura closed-loop del sistema BCI-triggered soft robotic glove</title>
<desc>Diagramma a blocchi: Paziente e Supervisione terapista in cima, 4 blocchi pipeline (Acquisizione EEG, Decoder BCI, Controllo Robot, Guanto Soft), feedback loop tratteggiato, dettagli tecnici in basso.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Colors: teal=#0F6E56, tealFill=#E1F5EE, purple=#534AB7, purpleFill=#EEEDFE, coral=#993C1D, coralFill=#FAECE7, amber=#854F0B, amberFill=#FAEEDA, gray border=#B4B2A9 -->

<!-- Top row -->
<!-- Paziente -->
<rect x="30" y="28" width="148" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="104" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Paziente</text>
<text x="104" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Motor Imagery · ERD μ/β</text>

<!-- Supervisione -->
<rect x="502" y="28" width="148" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="576" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Supervisione</text>
<text x="576" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Dashboard cloud · LoA 2</text>

<!-- Vertical dashed connectors -->
<line x1="104" y1="86" x2="104" y2="136" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="576" y1="86" x2="576" y2="136" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>

<!-- Hebbiana timing label -->
<rect x="156" y="104" width="112" height="26" rx="5" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="212" y="121" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">contingenza ≤ 300 ms</text>

<!-- Block 1: Acquisizione -->
<rect x="30" y="136" width="148" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="104" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Acquisizione</text>
<text x="104" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">EEG 8ch dry-electrode</text>
<text x="104" y="201" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">+ sensore respiratorio</text>

<!-- Arrow 1→2 -->
<line x1="178" y1="181" x2="214" y2="181" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="196" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">EEG</text>

<!-- Block 2: Decoder BCI -->
<rect x="216" y="136" width="148" height="90" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="290" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Decoder BCI</text>
<text x="290" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">FBCSP + Adaptive LDA</text>
<text x="290" y="201" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Woodbury · trigger ERD</text>

<!-- Arrow 2→3 -->
<line x1="364" y1="181" x2="400" y2="181" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="382" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">intent</text>

<!-- Block 3: Controllo robot -->
<rect x="402" y="136" width="148" height="90" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="476" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Controllo robot</text>
<text x="476" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Ammettenza F→v</text>
<text x="476" y="201" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Virtual fixtures ROM</text>

<!-- Arrow 3→4 -->
<line x1="550" y1="181" x2="568" y2="181" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Block 4: Guanto -->
<rect x="570" y="136" width="100" height="90" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="620" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Guanto soft</text>
<text x="620" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">Pneumatico</text>
<text x="620" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">5 dita · 2 DOF</text>
<text x="620" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">PneuNet</text>

<!-- Feedback loop -->
<path d="M 620 226 L 620 286 L 104 286 L 104 226" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
<text x="362" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Feedback visuo-propriocettivo → corteccia motoria</text>

<!-- Detail row -->
<!-- Detail A -->
<rect x="30" y="330" width="148" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="104" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">Personalizzazione</text>
<text x="104" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">DTW · database ADL</text>
<line x1="104" y1="330" x2="104" y2="226" stroke="#B4B2A9" stroke-width="0.7" stroke-dasharray="3 2"/>

<!-- Detail B -->
<rect x="216" y="330" width="148" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="290" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C">Non-stazionarietà</text>
<text x="290" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#534AB7">Hardware · cogn. · plasticità</text>
<line x1="290" y1="330" x2="290" y2="226" stroke="#B4B2A9" stroke-width="0.7" stroke-dasharray="3 2"/>

<!-- Detail C -->
<rect x="402" y="330" width="148" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="476" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#4A1B0C">Spasticità</text>
<text x="476" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">Sensori F → cedimento</text>
<line x1="476" y1="330" x2="476" y2="226" stroke="#B4B2A9" stroke-width="0.7" stroke-dasharray="3 2"/>

<!-- Detail D -->
<rect x="570" y="330" width="100" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="620" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402">Self-donning</text>
<text x="620" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">Snap · guide elastiche</text>
<line x1="620" y1="330" x2="620" y2="226" stroke="#B4B2A9" stroke-width="0.7" stroke-dasharray="3 2"/>

</svg>
