<svg width="100%" viewBox="0 0 680 232" role="img" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Closed-loop BCI-SRG system for post-stroke motor rehabilitation</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Block diagram showing the four-stage closed-loop pipeline: EEG acquisition with respiratory synchronisation feeds a FBCSP adaptive LDA decoder, whose ERD trigger drives a safety controller implementing virtual fixtures and admittance control, which actuates the soft pneumatic glove. A dashed visuo-proprioceptive feedback arrow closes the loop back to the patient. Remote clinical supervision connects to the glove stage via a cloud dashboard.</desc>
